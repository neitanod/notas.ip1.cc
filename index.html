<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title># Notas #</title>
    <link rel="stylesheet" type="text/css" href="inc/fontawesome/css/all.min.css"/>
    <link rel="stylesheet" type="text/css" href="inc/asciidoctor.css"/>
    <link rel="stylesheet" type="text/css" href="inc/notas.css?v=20260418i"/>
    <link rel="stylesheet" href="inc/hljs-atom-one-dark.min.css?v=20260418i">
    <link rel="icon" type="image/png" href="/favicons/favicon-128x128.png" sizes="128x128">
    <link rel="icon" type="image/png" href="/favicons/favicon-64x64.png" sizes="64x64">
    <link rel="icon" type="image/png" href="/favicons/favicon-32x32.png" sizes="32x32">
    <link rel="icon" type="image/png" href="/favicons/favicon-16x16.png" sizes="16x16">
    <script src="inc/jquery-2.1.1.min.js"></script>
    <script src="inc/marked.min.js"></script>
    <script src="inc/marked-highlight.umd.min.js"></script>
    <script src="inc/highlight.min.js"></script>
    <script>
      // El Chromium 87 de la TV (webOS) trae un ICU recortado: new Date().toString()
      // termina en "(-03)" donde el escritorio pone "(Argentina Standard Time)".
      // Opal —el runtime sobre el que corre Asciidoctor.js— saca el nombre de la zona
      // con match(/[A-Z]/g).join(""), y sin mayúsculas adentro del paréntesis eso es
      // un join() sobre null: la conversión entera tira TypeError y la nota AsciiDoc
      // se quedaba mostrando el texto crudo. Le devolvemos un paréntesis con el
      // offset en mayúsculas, solo en los motores que tienen el problema.
      (function() {
        var original = Date.prototype.toString;
        if (/\([^)]*[A-Z][^)]*\)/.test(original.call(new Date()))) { return; }
        Date.prototype.toString = function() {
          var s = original.call(this);
          var zona = (s.match(/GMT[+-]\d{4}/) || ['UTC'])[0];
          return /\([^)]*\)\s*$/.test(s)
            ? s.replace(/\([^)]*\)\s*$/, '(' + zona + ')')
            : s + ' (' + zona + ')';
        };
      })();
    </script>
    <script src="inc/asciidoctor.min.js"></script>
    <script>
      // Diagnóstico: indicador visible de qué parser está cargado
      window.__NOTAS_DEBUG__ = {
        marked: typeof marked !== 'undefined' ? (marked.version || 'present') : 'MISSING',
        markdown: typeof markdown !== 'undefined' ? 'legacy loaded' : 'none',
        hljs: typeof hljs !== 'undefined' ? hljs.versionString || 'present' : 'MISSING',
        markedHighlight: typeof markedHighlight !== 'undefined' ? 'present' : 'MISSING'
      };

      // Activa highlight.js dentro de marked (si las libs están cargadas)
      try {
        var _mh = (window.markedHighlight && (window.markedHighlight.markedHighlight || window.markedHighlight));
        if (_mh && window.hljs && typeof marked !== 'undefined') {
          marked.use(_mh({
            langPrefix: 'hljs language-',
            highlight: function(code, lang) {
              var language = hljs.getLanguage(lang) ? lang : 'plaintext';
              return hljs.highlight(code, { language: language, ignoreIllegals: true }).value;
            }
          }));
          window.__NOTAS_DEBUG__.hljs_init = 'ok';
        } else {
          window.__NOTAS_DEBUG__.hljs_init = 'skipped: marked='+(typeof marked)+' hljs='+(typeof hljs)+' mh='+(typeof markedHighlight);
        }
      } catch(e) {
        window.__NOTAS_DEBUG__.hljs_init = 'error: '+e.message;
        console.warn('highlight.js init failed:', e);
      }

      // Helper: render con marked y fallback al legacy si marked no existe
      function _renderMD(content) {
        if (typeof marked !== 'undefined' && marked.parse) {
          return marked.parse(content, { gfm: true });
        } else if (typeof markdown !== 'undefined' && markdown.toHTML) {
          return '<div style="background:#fee;color:#900;padding:6px;border:1px solid #c00;margin-bottom:10px">⚠️ Parser legacy (markdown.js). marked.js no cargó.</div>' + markdown.toHTML(content);
        } else {
          return '<div style="background:#fee;color:#900;padding:6px">❌ Ningún parser de Markdown disponible.</div><pre>'+content.replace(/</g,'&lt;')+'</pre>';
        }
      }

      function extractTitle(raw, isMd) {
        var frontmatterMatch = raw.match(/^---\s*\n([\s\S]*?)\n---/);
        if (frontmatterMatch) {
          var fm = frontmatterMatch[1];
          var nameMatch = fm.match(/^(?:title|name)\s*:\s*(.+)$/m);
          if (nameMatch) return nameMatch[1].replace(/^["']|["']$/g, '').trim();
          var descMatch = fm.match(/^description\s*:\s*(.+)$/m);
          if (descMatch) return descMatch[1].replace(/^["']|["']$/g, '').trim();
        }
        var body = frontmatterMatch ? raw.slice(frontmatterMatch[0].length).trim() : raw.trim();
        if (isMd) {
          var h = body.match(/^#{1,3}\s+(.+)$/m);
          if (h) return h[1].trim();
        } else {
          var ah = body.match(/^=+\s+(.+)$/m);
          if (ah) return ah[1].trim();
        }
        var firstLine = body.split('\n').find(function(l) { return l.trim().length > 0; });
        return firstLine ? firstLine.trim().substring(0, 120) : null;
      }

      function stripFrontmatter(raw) {
        return raw.replace(/^---\s*\n[\s\S]*?\n---\s*\n?/, '');
      }

      jQuery(function(){
        var s = (location.href.split("#")[0]||location.href);
        s = (s.split("?")[1]||'index');
        var md = false;
        var isRemote = false;
        var forceMd = /(^|&)md(&|=|$)/.test(s);
        s = s.includes('&')?s.substring(0, s.indexOf('&')):s;

        if(s.startsWith('http://') || s.startsWith('https://')) {
          isRemote = true;
          md = forceMd || s.endsWith('.md') || s.indexOf('publish.ip1.cc/') !== -1;
        } else {
          s.includes('.md')?md=true:null;
        }

        function renderContent(content) {
          var t = extractTitle(content, md);
          if (t) document.title = t;
          var clean = stripFrontmatter(content);
          try {
            if(md) {
              $('#contents').html(_renderMD(clean));
            } else {
              $('#contents').html(Asciidoctor().convert(clean))
                .find("span.icon")
                .replaceWith(function(e) {
                  return '<i class="fa fa-'+$(this).text().replace(/[\[\]]+/g,"")+'"/>';
                });
            }
          } catch(e) {
            // Un parser que explota dejaba en pantalla el texto crudo que había puesto
            // el .load(), y parecía que la nota estaba "sin formato" por su culpa. Que
            // el error se vea: es lo que se le pide a alguien que reporta el problema.
            console.error('Fallo el render:', e);
            $('#contents').html(
              '<div style="background:#fee;color:#900;padding:8px;border:1px solid #c00;margin-bottom:10px">' +
              '⚠️ No se pudo renderizar (' + (md ? 'Markdown' : 'AsciiDoc') + '): ' + (e && e.message) +
              '</div><pre></pre>');
            $('#contents').find('pre').text(clean);
            return;
          }
          // El resaltado de AsciiDoc va aparte —en Markdown ya lo hizo marked-highlight
          // mientras parseaba—: si highlight.js falla con un lenguaje raro, el documento
          // ya está en pantalla y se queda ahí.
          if(!md) {
            try {
              $('#contents').find('pre code').each(function() { hljs.highlightElement(this); });
            } catch(e) {
              console.warn('highlight.js fallo:', e);
            }
          }
        }

        // Archivos privados de publish: requieren Basic auth. El fetch va con
        // credentials:'include' (el browser manda la clave guardada). Ante 401
        // se ofrece el login de publish en un tab que se cierra solo, y se
        // reintenta hasta que el usuario se autentique. Nunca via proxy.php.
        var isPrivatePublish = /publish\.ip1\.cc\/private\//.test(s);

        function privateLoginUrl() {
          return s.replace(/(\/private\/[0-9a-f]{8}\/).*$/, '$1login');
        }

        function loadPrivate() {
          return fetch(s, {credentials: 'include'}).then(function(response) {
            if (!response.ok) throw new Error('HTTP ' + response.status);
            return response.text();
          }).then(renderContent);
        }

        function showPrivateLogin() {
          $('#contents').html(
            '<div style="text-align:center; padding-top:3rem;">' +
            '<h1>🔒 Documento privado</h1>' +
            '<p>Este archivo requiere una clave de acceso.</p>' +
            '<p><button id="private-login-btn" style="font-size:1.1rem; padding:0.6rem 1.4rem; cursor:pointer;">Ingresar clave</button></p>' +
            '<p style="color:#888;">Se abre una pestaña de publish.ip1.cc que se cierra sola; esta página carga el documento al autenticarte.</p>' +
            '</div>');
          $('#private-login-btn').on('click', function() {
            window.open(privateLoginUrl());
            var tries = 0;
            var iv = setInterval(function() {
              tries++;
              if (tries > 150) { clearInterval(iv); return; }
              loadPrivate().then(function() { clearInterval(iv); }).catch(function(){});
            }, 1500);
          });
        }

        if(isPrivatePublish) {
          loadPrivate().catch(showPrivateLogin);
        } else if(isRemote) {
          fetch(s)
            .then(function(response) {
              if (!response.ok) throw new Error('Network response was not ok');
              return response.text();
            })
            .then(renderContent)
            .catch(function(error) {
              console.log('Direct fetch failed, trying CORS proxy...', error);
              var proxyUrl = 'https://notas.ip1.cc/proxy.php?url=' + encodeURIComponent(s);
              fetch(proxyUrl)
                .then(function(response) {
                  if (!response.ok) throw new Error('Proxy response was not ok');
                  return response.text();
                })
                .then(renderContent)
                .catch(function(proxyError) {
                  $('#contents').html('<h1>Error loading remote content</h1><p>Could not load: ' + s + '</p><p>Direct fetch error: ' + error.message + '</p><p>CORS proxy error: ' + proxyError.message + '</p><p>The URL might be inaccessible or blocked.</p>');
                });
            });
        } else {
          if( !md ) {
            $('#contents').load(s+'.txt', function(){
              renderContent($('#contents').text());
            });
          } else {
            $('#contents').load(s, function(){
              renderContent($('#contents').text());
            });
          }
        }
      });
    </script>
  </head>
  <body>
    <div id="contents">
    <img style="display:block; margin: auto;" src="inc/loading.gif" alt="Cargando...">
    </div>
  </body>
</html>
